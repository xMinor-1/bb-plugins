<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="240" height="240" role="img" aria-label="Theme Toggle">
  <!-- A square split along the diagonal: day above the cut, night below it.
       The half that is on is filled and holds its symbol punched through;
       the other half is an empty outline with its symbol drawn small. This
       file is the night face — the still version bb shows in the catalog —
       and app.tsx flips the fill to the day half while the light appearance
       is on.

       BB draws plugin artwork as a CSS mask, which keys off alpha coverage
       only: the symbols are cut out through an SVG mask rather than painted
       lighter, and nothing sits behind the shapes — a filled background would
       mask into one solid square. The drawing uses the whole canvas, since bb
       fits the entire viewBox into 16 px of chrome. -->
  <clipPath id="tt-square"><rect width="24" height="24" rx="5"/></clipPath>
  <clipPath id="tt-day"><polygon points="1,0 24,0 24,23"/></clipPath>
  <clipPath id="tt-night"><polygon points="0,1 23,24 0,24"/></clipPath>
  <defs>
    <mask id="tt-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="#000" transform="translate(2 10.8) scale(0.4667)"/>
    </mask>
  </defs>
  <g clip-path="url(#tt-square)">
    <g clip-path="url(#tt-night)">
      <rect width="24" height="24" rx="5" fill="#000" mask="url(#tt-cut)"/>
    </g>
    <g clip-path="url(#tt-day)">
      <rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M2.2 0.2L23.8 21.8" fill="none" stroke="#000" stroke-width="2"/>
    </g>
    <circle cx="17.2" cy="6.8" r="1.9" fill="#000"/>
    <g stroke="#000" stroke-width="1.25" stroke-linecap="round">
      <path d="M19.69 7.83L20.25 8.06M18.23 9.29L18.46 9.85M16.17 9.29L15.94 9.85M14.71 7.83L14.15 8.06M14.71 5.77L14.15 5.54M16.17 4.31L15.94 3.75M18.23 4.31L18.46 3.75M19.69 5.77L20.25 5.54"/>
    </g>
  </g>
</svg>
