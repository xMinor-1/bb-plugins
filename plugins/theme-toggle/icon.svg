<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24.4 16.4" width="244" height="164" role="img" aria-label="Theme Toggle">
  <!-- A day/night switch resting on its night face: knob left, crescent right.
       BB draws plugin artwork as a CSS mask, which keys off alpha coverage
       only: the switch body is the opaque shape, and the knob and the moon are
       holes punched through it, the way the reference switch reads. A filled
       background would mask into one solid square, so nothing sits behind.

       The canvas is cropped to the drawing — bb fits the whole viewBox into a
       16 px box, so any margin here is margin the icon loses next to the other
       footer icons.

       app.tsx repaints the button with the day face (sun left, knob right)
       whenever the light appearance is on; the two drawings live side by side
       there and must stay in step with this file. -->
  <defs>
    <mask id="bb-theme-toggle-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24.4" height="16.4">
      <rect width="24.4" height="16.4" fill="#fff"/>
      <circle cx="8.2" cy="8.2" r="4.8" fill="#000"/>
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="#000" transform="translate(13.32 3.88) scale(0.36)"/>
      <path d="M21.9 4.85Q22.15 5.45 22.75 5.7 22.15 5.95 21.9 6.55 21.65 5.95 21.05 5.7 21.65 5.45 21.9 4.85Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="24.4" height="16.4" rx="8.2" fill="#000" mask="url(#bb-theme-toggle-cut)"/>
</svg>
